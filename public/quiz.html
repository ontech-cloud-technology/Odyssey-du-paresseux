{% extends "base.html" %}

{% block title %}Quiz - L'Odyssée du Paresseux{% endblock %}

{% block extra_css %}
<style>
    .quiz-question {
        margin-bottom: 2rem;
    }
    
    .quiz-option {
        padding: 1rem;
        margin: 0.5rem 0;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .quiz-option:hover {
        background: rgba(76, 175, 80, 0.3);
    }
    
    .quiz-option.correct {
        background: rgba(34, 197, 94, 0.5);
    }
    
    .quiz-option.incorrect {
        background: rgba(220, 38, 38, 0.5);
    }
</style>
{% endblock %}

{% block content %}
<section class="container mx-auto px-4 py-20 relative z-10">
    <div class="glass-strong rounded-3xl p-8 md:p-12">
        <h1 class="title-font text-4xl md:text-5xl font-bold text-readable-strong mb-8 text-center">
            🧠 Test : Connaissez-vous les Paresseux et le Costa Rica ?
        </h1>
        <div class="glass rounded-2xl p-6 max-w-3xl mx-auto">
            <div id="quizContainer">
                <!-- Le quiz sera généré dynamiquement -->
            </div>
            <div id="quizResults" class="hidden text-center mt-6">
                <h3 class="text-2xl font-bold text-readable-strong mb-4">Résultats</h3>
                <p class="text-readable text-xl mb-4" id="quizScore"></p>
                <button onclick="restartQuiz()" class="btn-glow glass-strong px-6 py-3 rounded-lg text-readable-strong font-bold hover:scale-110 transition-transform">
                    <i class="fas fa-redo"></i> Recommencer
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="/static/quiz-questions.js"></script>
<script>
let quizQuestions = [];
let currentQuestion = 0;
let quizScore = 0;
let quizAnswers = [];
const QUESTIONS_PER_QUIZ = 10; // Nombre de questions par quiz

function initQuiz() {
    // Obtenir 10 questions aléatoires
    quizQuestions = getRandomQuestions(QUESTIONS_PER_QUIZ);
    currentQuestion = 0;
    quizScore = 0;
    quizAnswers = [];
    loadQuiz();
}

function loadQuiz() {
    const container = document.getElementById('quizContainer');
    if (!container || currentQuestion >= quizQuestions.length) {
        showQuizResults();
        return;
    }
    
    const question = quizQuestions[currentQuestion];
    container.innerHTML = `
        <div class="quiz-question">
            <h3 class="text-2xl font-bold text-readable-strong mb-4">Question ${currentQuestion + 1}/${quizQuestions.length}</h3>
            <p class="text-readable text-xl mb-6">${question.question}</p>
            <div class="space-y-2">
                ${question.options.map((option, index) => `
                    <div class="quiz-option glass" onclick="selectQuizAnswer(${index})">
                        <p class="text-readable">${option}</p>
                    </div>
                `).join('')}
            </div>
            <div class="mt-4 text-readable text-sm opacity-70">
                <p>💡 Chaque quiz contient ${QUESTIONS_PER_QUIZ} questions sélectionnées aléatoirement parmi ${QUIZ_QUESTIONS.length} questions disponibles !</p>
            </div>
        </div>
    `;
}

function selectQuizAnswer(selectedIndex) {
    const question = quizQuestions[currentQuestion];
    const isCorrect = selectedIndex === question.correct;
    
    if (isCorrect) {
        quizScore++;
    }
    
    quizAnswers.push({ question: currentQuestion, selected: selectedIndex, correct: isCorrect });
    
    const options = document.querySelectorAll('.quiz-option');
    options.forEach((opt, idx) => {
        opt.style.pointerEvents = 'none';
        if (idx === question.correct) {
            opt.classList.add('correct');
        } else if (idx === selectedIndex && !isCorrect) {
            opt.classList.add('incorrect');
        }
    });
    
    setTimeout(() => {
        currentQuestion++;
        loadQuiz();
    }, 2000);
}

function showQuizResults() {
    const container = document.getElementById('quizContainer');
    const results = document.getElementById('quizResults');
    
    if (container) container.classList.add('hidden');
    if (results) {
        results.classList.remove('hidden');
        const percentage = Math.round((quizScore / quizQuestions.length) * 100);
        let message = '';
        if (percentage === 100) {
            message = '🎉 Parfait ! Vous êtes un expert !';
        } else if (percentage >= 80) {
            message = '🌟 Excellent ! Vous connaissez bien le sujet !';
        } else if (percentage >= 60) {
            message = '👍 Bien joué ! Vous avez de bonnes connaissances !';
        } else if (percentage >= 40) {
            message = '📚 Pas mal ! Continuez à apprendre !';
        } else {
            message = '💪 Continuez ! La pratique rend parfait !';
        }
        
        document.getElementById('quizScore').innerHTML = 
            `<p class="text-2xl mb-2">${message}</p>
             <p class="text-readable text-xl">Vous avez obtenu ${quizScore}/${quizQuestions.length} (${percentage}%)</p>`;
    }
}

function restartQuiz() {
    initQuiz();
    const container = document.getElementById('quizContainer');
    const results = document.getElementById('quizResults');
    if (container) container.classList.remove('hidden');
    if (results) results.classList.add('hidden');
}

if (document.getElementById('quizContainer')) {
    initQuiz();
}
</script>
{% endblock %}
